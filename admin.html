 <!-- ================= PAINEL ADMIN (OVERLAY) ================= -->
  <div id="admin-overlay">
    <div class="admin-container">
      
      <div id="tela-login" class="login-box">
        <button class="btn-fechar" onclick="fecharAdmin()">&times;</button>
        <h2 style="text-align: center; margin-bottom: 20px; color: var(--dourado);">Acesso Restrito</h2>
        <form id="form-login">
          <div class="campo"><label>E-mail</label><input type="email" id="l-email" required></div>
          <div class="campo"><label>Senha</label><input type="password" id="l-senha" required></div>
          <button type="submit" class="btn" style="width: 100%;" id="btn-entrar">Entrar no Painel</button>
          <span id="status-login" class="alerta"></span>
        </form>
      </div>

      <div id="tela-dash" style="display: none;">
        <div class="dash-header">
          <h2 style="color: var(--dourado);">Painel Administrativo</h2>
          <div>
            <button class="btn btn-outline" onclick="fecharAdmin()">Voltar ao Site</button>
            <button class="btn btn-perigo" onclick="sairDoPainel()" style="margin-left: 10px;">Sair</button>
          </div>
        </div>

        <div class="dash-tabs">
          <button class="tab-btn ativo" onclick="mudarAba('leads', this)">Mensagens (Leads)</button>
          <button class="tab-btn" onclick="mudarAba('projetos', this)">Gerenciar Projetos</button>
        </div>

        <div id="aba-leads" class="tab-conteudo ativo"><div id="lista-leads"></div></div>

        <div id="aba-projetos" class="tab-conteudo">
          <form id="form-projeto" class="form-projeto">
            <input type="hidden" id="p-id">
            <div class="campo full"><label>Título do Projeto *</label><input type="text" id="p-titulo" required></div>
            <div class="campo full"><label>Descrição</label><textarea id="p-descricao" style="min-height: 80px;"></textarea></div>
            <div class="campo"><label>Link do Projeto (URL)</label><input type="url" id="p-link" placeholder="https://..."></div>
            <div class="campo"><label>Imagem do Projeto</label><input type="file" id="p-imagem" accept="image/*"></div>
            <div class="campo full"><label><input type="checkbox" id="p-publicado"> Publicar este projeto no site</label></div>
            <div class="full">
              <button type="submit" class="btn" id="btn-salvar-proj">Salvar Projeto</button>
              <button type="button" class="btn btn-outline" onclick="limparFormProjeto()" id="btn-cancelar-proj" style="display: none;">Cancelar</button>
              <span id="status-proj" class="alerta" style="text-align: left;"></span>
            </div>
          </form>
          <h3 style="margin-bottom: 15px; color: var(--cinza);">Projetos Cadastrados</h3>
          <div id="lista-projetos-admin"></div>
        </div>
      </div>
    </div>
  </div>
